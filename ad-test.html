<!doctype html>
<html lang="en">
<head>

      display: flex;
      justify-content: center;

      width: 300px;
      min-height: 250px;

  <!-- ClickAdilla / WP Ad Manager publisher code -->

    <h1>ARGAMES Ad Test</h1>

    <div class="ad-box">
      <div data-banner-id="1499081"></div>

    <div class="label">
